services:
  app:
    build: .
    container_name: app_service
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-postgres_db}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      DMI_API_URL: ${DMI_API_URL:-https://opendataapi.dmi.dk/v2/metObs/collections/observation/items}
      DMI_STATIONS_URL: ${DMI_STATIONS_URL:-https://opendataapi.dmi.dk/v2/metObs/collections/station/items}
      DMI_PARAMETER_IDS: ${DMI_PARAMETER_IDS:-temp_dry,humidity}
      DMI_STATION_ID: ${DMI_STATION_ID:-}
      DMI_LOOKBACK_MINUTES: ${DMI_LOOKBACK_MINUTES:-60}
      DMI_PAGE_SIZE: ${DMI_PAGE_SIZE:-1000}
      DMI_POLL_SECONDS: ${DMI_POLL_SECONDS:-300}
      DMI_FETCH_STATIONS: ${DMI_FETCH_STATIONS:-true}

  tests:
    build: .
    container_name: test_service
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-postgres_db}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      DMI_API_URL: ${DMI_API_URL:-https://opendataapi.dmi.dk/v2/metObs/collections/observation/items}
    command: pytest --cov=app

  db:
    image: postgres:16
    container_name: postgres_db_service
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres_db}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-postgres_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin_service
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_USER_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-password}
    ports:
      - "8080:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro

volumes:
  postgres_data:
  pgadmin_data:
