name: DMI ETL

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dmi-etl
  cancel-in-progress: false

jobs:
  run-etl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DMI_API_URL: https://opendataapi.dmi.dk/v2/metObs/collections
      POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
      POSTGRES_PORT: ${{ secrets.POSTGRES_PORT || '5432' }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate database configuration
        env:
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          : "${POSTGRES_HOST:?Set the POSTGRES_HOST repository secret to the hosted database hostname.}"
          : "${POSTGRES_DB:?Set the POSTGRES_DB repository secret.}"
          : "${POSTGRES_USER:?Set the POSTGRES_USER repository secret.}"
          : "${POSTGRES_PASSWORD:?Set the POSTGRES_PASSWORD repository secret.}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install application dependencies
        run: python -m pip install -r requirements.txt

      - name: Run one ETL cycle
        run: python -m app.main
