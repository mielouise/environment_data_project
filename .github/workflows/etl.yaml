- name: Build image
  run: docker compose up --build app

- name: Start DB service
  run: docker compose up -d db

- name: Wait for Postgres to become ready
  env:
    POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
    POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
  run: |
    # retry up to 30 times for pg_isready inside the db container
    for i in $(seq 1 30); do
      if docker compose exec -T db pg_isready -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" >/dev/null 2>&1; then
        echo "Postgres is ready"; break
      fi
      echo "Waiting for Postgres... ($i)"
      sleep 2
    done

- name: Run ETL pipeline (start app + deps and return app exit code)
  run: docker compose up --exit-code-from app app