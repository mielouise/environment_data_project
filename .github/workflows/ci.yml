name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
    branches:
      - main

  push:
    branches:
      - main

  merge_group:

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: CI quality (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: ci
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Configure isolated test environment
        run: cp .env.example .env

      - name: Build runtime and test images
        run: docker compose build app tests

      - name: Check lint and formatting
        run: |
          docker compose run --rm --no-deps tests ruff check app tests
          docker compose run --rm --no-deps tests ruff format --check app tests

      - name: Run unit tests with at least 95 percent coverage
        run: >-
          docker compose run --rm --no-deps tests
          pytest tests/unit --cov=app --cov-report=term-missing --cov-fail-under=95

      - name: Run PostgreSQL integration and migration tests
        run: >-
          docker compose run --rm tests
          pytest tests/integration/test_postgres.py -v

      - name: Export verified runtime image for manual deployment
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          mkdir -p dist
          docker image save "environment-data:$IMAGE_TAG" | gzip > dist/environment-data.tar.gz

      - name: Upload delivery artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: environment-data-${{ github.sha }}
          path: dist/environment-data.tar.gz
          if-no-files-found: error
          retention-days: 14

      - name: Show database logs on failure
        if: failure()
        run: docker compose logs --no-color db

      - name: Clean up test containers and volumes
        if: always()
        run: docker compose down --volumes --remove-orphans
