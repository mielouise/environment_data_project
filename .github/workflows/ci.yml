name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:

    name: CI Quality

    runs-on: ubuntu-latest

    timeout-minutes: 15

    env:
      COMPOSE_PROJECT_NAME: ci

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure test environment
        run: |
          cp .env.example .env

      #
      # 1. Build Docker images
      #
      - name: Build Docker images
        run: |
          docker compose build

      #
      # 2. Start PostgreSQL
      #
      - name: Start PostgreSQL
        run: |
          docker compose up -d db

      #
      # Wait for PostgreSQL
      #
      - name: Wait for PostgreSQL
        run: |
          until docker compose exec -T db pg_isready \
            -U test_user \
            -d test_db
          do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done

      #
      # 3. Run migrations
      #
      - name: Run database migrations
        run: |
          docker compose run --rm app \
          python -m app.migration_runner

      #
      # 4. Run unit tests (minimum 95 % coverage)
      #
      - name: Run unit tests
        run: |
          docker compose run --rm tests \
          pytest tests/unit \
          --cov=app \
          --cov-report=term-missing \
          --cov-fail-under=95

      #
      # 5. Run integration tests
      #
      - name: Run integration tests
        run: |
          docker compose run --rm tests \
          pytest tests/integration -v

      #
      # Database logs if something fails
      #
      - name: Show PostgreSQL logs on failure
        if: failure()
        run: |
          docker compose logs --no-color db

      #
      # Cleanup
      #
      - name: Remove containers and volumes
        if: always()
        run: |
          docker compose down --volumes --remove-orphans