name: CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  merge_group:

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:

    name: CI Quality (Docker)

    runs-on: ubuntu-latest

    timeout-minutes: 15

    env:
      COMPOSE_PROJECT_NAME: ci

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure test environment
        run: |
          cp .env.example .env

      #
      # 1. Build Docker images
      #
      - name: Build Docker images
        run: |
          docker compose build app tests

      #
      # 2. Start PostgreSQL container
      #
      - name: Start PostgreSQL
        run: |
          docker compose up -d db

      #
      # Wait until PostgreSQL is healthy
      #
      - name: Wait for PostgreSQL
        run: |
          until docker compose exec -T db pg_isready \
            -U "${POSTGRES_USER}" \
            -d "${POSTGRES_DB}"
          do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done

      #
      # 3. Run database migrations
      #
      - name: Run database migrations
        run: |
          docker compose run --rm app \
          python -m app.migration_runner

      #
      # 4. Run unit tests
      #
      - name: Run unit tests
        run: |
          docker compose run --rm tests \
          pytest tests/unit \
          --cov=app \
          --cov-report=term-missing \
          --cov-fail-under=95

      #
      # 5. Run integration tests
      #
      - name: Run integration tests
        run: |
          docker compose run --rm tests \
          pytest tests/integration -v

      #
      # 6. Run linting
      #
      - name: Run Ruff linting
        run: |
          docker compose run --rm --no-deps tests \
          ruff check app tests

      #
      # 7. Run formatter check
      #
      - name: Run Ruff format check
        run: |
          docker compose run --rm --no-deps tests \
          ruff format --check app tests

      #
      # Show PostgreSQL logs when a step fails
      #
      - name: Show PostgreSQL logs on failure
        if: failure()
        run: |
          docker compose logs --no-color db

      #
      # Cleanup
      #
      - name: Remove containers and volumes
        if: always()
        run: |
          docker compose down --volumes --remove-orphans